<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jong RECRON — Offline</title>
  <meta name="theme-color" content="#003E6F" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #003E6F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      color: #5a6272;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #F47D00;
      color: white;
      font-weight: 700;
      padding: 0.85rem 2rem;
      border-radius: 0.875rem;
      text-decoration: none;
      box-shadow: 0 5px 0 #A84E00;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #A84E00;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">📡</span>
    <h1>Je bent offline</h1>
    <p>Geen zorgen! Zodra je weer verbinding hebt, kun je gewoon verder spelen. De ervaring werkt ook zonder internet.</p>
    <a href="/" class="btn">Probeer opnieuw</a>
  </div>
</body>
</html>
